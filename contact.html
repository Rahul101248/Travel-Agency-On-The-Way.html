<div class="contact-container">

    <h2>Contact Us</h2>

    <p><strong>Address:</strong> Chattogram, Bangladesh</p>
    <p><strong>Phone:</strong> +88017XXXXXXXX</p>
    <p><strong>Email:</strong> info@ontheway.com</p>

    <hr><br>

    <input
        type="text"
        id="contactName"
        placeholder="Your Name"
    >

    <input
        type="email"
        id="contactEmail"
        placeholder="Your Email"
    >

    <input
        type="text"
        id="contactSubject"
        placeholder="Subject"
    >

    <textarea
        id="contactMessage"
        placeholder="Write Your Message">
    </textarea>

    <button
        class="btn"
        onclick="submitContactForm()">
        Send Message
    </button>

</div>
