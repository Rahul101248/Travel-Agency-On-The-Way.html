<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tour - ON THE WAY</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">ON THE WAY</div>

    <ul id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</nav>

<div class="form-container">

    <h2>Tour Booking Form</h2>

    <form id="bookingForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <select id="gender" required>

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>

        <input
            type="number"
            id="age"
            placeholder="Age"
            required
        >

        <input
            type="text"
            id="package"
            readonly
        >

        <label>
            Select Tour Date
        </label>

        <input
            type="date"
            id="tourDate"
            required
        >

        <button
            type="submit"
            class="btn">
            Continue To Payment
        </button>

    </form>

</div>

<footer>
    <h3>ON THE WAY</h3>
    <p>Travel With Confidence</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
