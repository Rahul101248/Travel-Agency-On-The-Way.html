<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Packages - ON THE WAY</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">ON THE WAY</div>

    <ul id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</nav>

<section class="hero">
    <h1>Our Tour Packages</h1>
    <p>Find your dream destination</p>

    <input
        type="text"
        id="searchInput"
        placeholder="Search Destination..."
        onkeyup="searchPackage()"
    >

    <h3 id="notFoundMessage"></h3>
</section>

<section class="destinations">

    <div class="card-container">

        <div class="card package-card">
            <img src="images/bandarban.jpg" alt="bandarban">
            <h3>Bandarban</h3>
            <p>Price: ৳7500</p>

            <button
                class="btn"
                onclick="viewDetails('Bandarban')">
                View Details
            </button>
        </div>

        <div class="card package-card">
            <img src="images/sylhet.jpg" alt="sylhet">
            <h3>Sylhet</h3>
            <p>Price: ৳5500</p>

            <button
                class="btn"
                onclick="viewDetails('Sylhet')">
                View Details
            </button>
        </div>

        <div class="card package-card">
            <img src="images/rangamati.jpg" alt="Rangamati">
            <h3>Rangamati</h3>
            <p>Price: ৳5000</p>

            <button
                class="btn"
                onclick="viewDetails('Rangamati')">
                View Details
            </button>
        </div>

        <div class="card package-card">
            <img src="images/sundarbans.jpg" alt="sundarbans">
            <h3>Sundarbans</h3>
            <p>Price: ৳6500</p>

            <button
                class="btn"
                onclick="viewDetails('Sundarbans')">
                View Details
            </button>
        </div>

        <div class="card package-card">
            <img src="images/coxsbazar.jpg" alt="CoxsBazar">
            <h3>CoxsBazar</h3>
            <p>Price: ৳8000</p>

            <button
                class="btn"
                onclick="viewDetails('CoxsBazar')">
                View Details
            </button>
        </div>

    </div>

</section>

<footer>
    <h3>ON THE WAY</h3>
    <p>Travel With Confidence</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
